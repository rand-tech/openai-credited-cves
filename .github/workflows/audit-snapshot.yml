name: Audit full cvelistV5 snapshot for missed CVEs

on:
  schedule:
    # Monthly, 1st at 03:41 UTC
    - cron: "41 3 1 * *"
  workflow_dispatch: {}

# Shares the scanner's group: both write state/seen.json.
concurrency:
  group: scan-cves
  cancel-in-progress: false

permissions:
  contents: write  # commit state/seen.json
  actions: write   # dispatch scan-cves.yml to process the queue

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Download latest cvelistV5 snapshot
        # The release asset is a zip wrapping the snapshot zip; unwrap it once
        # and let the audit read records straight from the inner zip.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/snap" && cd "$RUNNER_TEMP/snap"
          gh release download -R CVEProject/cvelistV5 -p '*all_CVEs_at_midnight*'
          unzip -q ./*.zip.zip
          rm ./*.zip.zip
          echo "SNAPSHOT_ZIP=$(ls "$RUNNER_TEMP"/snap/*.zip)" >> "$GITHUB_ENV"

      - name: Audit
        run: python .github/scripts/audit_snapshot.py "$SNAPSHOT_ZIP"

      - name: Commit queued CVEs and run the scanner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -n "$(git status --porcelain state/)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "chore(state): queue CVEs found by snapshot audit [skip ci]"
            git pull --rebase origin main
            git push
            gh workflow run scan-cves.yml --ref main
          else
            echo "Snapshot audit found nothing new."
          fi
